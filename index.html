<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />
  <title>Working with Objects</title>
  <link rel="stylesheet" href="./assets/styles/app.css" />
  <script src="./assets/scripts/objects.js" defer></script>
</head>

<body>
  <header>
    <a href="https://all-projects-portfolio.web.app/" target="_blank" class="row">
      <img class="logo-img" src="./assets/logo.svg" />
      <div class="logo-txt">
        <h1>FLAVIA</h1>
        <span>Kosti</span>
      </div>
    </a>
  </header>
  <main>
    <div class="container">
      <section id="user-input" class="card">
        <div class="control">
          <label for="title">Favorite Movie</label>
          <input type="text" id="title" />
        </div>
        <div class="inline-controls">
          <div class="control">
            <label for="extra-name">Release Date</label>
            <input type="text" id="extra-name" />
          </div>
          <div class="control">
            <label for="extra-value">Summary</label>
            <textarea type="text" id="extra-value"></textarea>
          </div>
        </div>
        <div class="row end">
          <button id="add-movie-btn">Add Movie</button>
        </div>
      </section>
    </div>
    <div class="flex-column">
      <section class="row" id="filter">
        <input type="text" id="filter-title" />
        <button id="search-btn">Search</button>
      </section>
      <ul id="movie-list"></ul>
      <img id="empty" src="./assets/empty.svg">
    </div>
  </main>
</body>

</html>
